      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        run: npx expo install --fix
        env:
          CI: '1'

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Build RELEASE APK with embedded JS bundle
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          NODE_ENV: production
          CI: '1'

      - name: Verify release APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/XAUUSD-Pro-Trader-v1.0.1-RELEASE.apk
          ls -lh dist/XAUUSD-Pro-Trader-v1.0.1-RELEASE.apk

      - name: Upload RELEASE APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Pro-Trader-v1.0.1-RELEASE
          path: dist/XAUUSD-Pro-Trader-v1.0.1-RELEASE.apk
          if-no-files-found: error
          retention-days: 14