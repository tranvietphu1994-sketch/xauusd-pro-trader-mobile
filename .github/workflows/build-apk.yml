name: Build XAUUSD Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate mobile source
        shell: bash
        run: |
          cat > /tmp/xauusd_payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/xauusd_payload.b64 > /tmp/xauusd_payload.zip
          unzip -q /tmp/xauusd_payload.zip -d /tmp/xauusd_source
          cp -a /tmp/xauusd_source/xauusd_mobile_trader/. "$GITHUB_WORKSPACE"/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        run: npx expo install --fix
        env:
          CI: '1'

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/XAUUSD-Pro-Trader-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Pro-Trader-v1.0-APK
          path: dist/XAUUSD-Pro-Trader-v1.0.apk
          if-no-files-found: error
          retention-days: 14